          description: OK → client reloads.
        "403":
          description: Wrong PIN → "pin_wrong".
    delete:
      tags: [admin]
      summary: Leave service-account mode
      description: Routes by the returned role - staff role → `/admin`, else `/`.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccountExitResponse" }

  /api/webhooks/{provider}:
    post:
      tags: [webhooks]
      summary: Incoming payment provider webhook
      description: |
        Server-to-server callback hit by an external payment provider, not the
        browser. Body is a provider-specific signed payload (opaque). Method is
        provider-defined (typically POST; some providers use GET redirects).
        Response is a provider-specific ack, not consumed by the browser.
        `tochka` uses this single path for both incoming and payout.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Payment provider slug.
          schema:
            type: string
            enum:
              - yoomoney
              - yookassa
              - heleket
              - freekassa
              - betatransfer
              - skinpay
              - skinsback
              - robokassa
              - paypalych
              - tbank
              - anypay
              - tome
              - platega
              - cardlink
              - paymaster
              - tochka
      requestBody:
        required: false
        description: Provider-specific signed payload (opaque).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Provider-specific ack (not consumed by the client).
        "404":
          description: 'Unknown provider slug → `{ error: "unknown_provider" }`.'
    get:
      tags: [webhooks]
      summary: Incoming payment provider webhook (GET self-test)
      description: |
        Some providers configure a GET self-test / redirect ping to the same path.
        Same provider slug set as POST. Acknowledged with 200 for a known provider,
        404 `unknown_provider` otherwise.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Payment provider slug (same enum as POST on this path).
          schema: { type: string }
      responses:
        "200":
          description: Provider-specific ack (not consumed by the client).
        "404":
          description: 'Unknown provider slug → `{ error: "unknown_provider" }`.'

  /api/webhooks/payout/{provider}:
    post:
      tags: [webhooks]
      summary: Payout provider webhook
      description: |
        Server-to-server payout status callback. Body/method provider-defined and
        opaque. Note: `tochka` payout maps to the non-`/payout/` path
        (`/api/webhooks/tochka`).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Payout provider slug.
          schema:
            type: string
            enum:
              - yookassa
              - heleket
              - tbank
              - yoomoney
              - paypalych
              - robokassa
              - anypay
              - tome
              - platega
      requestBody:
        required: false
        description: Provider-specific payout status callback (opaque).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Provider-specific ack (not consumed by the client).
        "404":
          description: 'Unknown provider slug → `{ error: "unknown_provider" }`.'
    get:
      tags: [webhooks]
      summary: Payout provider webhook (GET self-test)
      description: |
        GET self-test / redirect ping variant. Same payout provider slug set as
        POST. Acknowledged with 200 for a known provider, 404 `unknown_provider`
        otherwise.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Payout provider slug (same enum as POST on this path).
          schema: { type: string }
      responses:
        "200":
          description: Provider-specific ack (not consumed by the client).
        "404":
          description: 'Unknown provider slug → `{ error: "unknown_provider" }`.'

