  /api/secure-chat-download:
    get:
      tags: [misc]
      summary: Secure chat attachment download
      description: |
        Not `fetch`-ed; rendered directly as `<img src>` / download href. Streams a
        chat attachment/file (binary). The full URL (a signed token/id) arrives in
        chat-message attachment data and is used verbatim - the client never builds
        the query string.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: File bytes (image or downloadable attachment).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/track/page-view:
    post:
      tags: [misc]
      summary: Page-view analytics beacon
      description: |
        Preferred transport `navigator.sendBeacon`; fallback `fetch` with
        `keepalive:true, credentials:"same-origin"`. Fired on every client route
        change and re-fired on a 3-min heartbeat (`referrer: null`).
        Fire-and-forget - response not read.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackPageViewRequest" }
      responses:
        "204":
          description: Accepted (response not read)

  /api/users/picker:
    get:
      tags: [admin]
      summary: User picker autocomplete
      description: |
        Reusable user-picker (admin/staff assignment, seller selection). 280ms
        debounce, AbortController. `q=<id>` resolves a single preselected user.
        Non-array/missing `users` → [].
      security: [{ cookieAuth: [] }]
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Free-text search (trimmed); also a numeric id to resolve one user.
        - name: staff
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Restrict to staff (mutually exclusive with sellerTier/sellers).
        - name: sellerTier
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Restrict to seller-tier users.
        - name: sellers
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Restrict to sellers.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickerResponse" }

