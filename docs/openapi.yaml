      description: 'Hook `useBuyerSubscriptions`. `cache:"no-store"`. Non-OK → `{ subscriptions: [], offerings: [] }`.'
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipsResponse" }
    patch:
      tags: [subscriptions]
      summary: Toggle auto-renew
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionId: { type: string }
                autoRenew: { type: boolean }
              required: [subscriptionId, autoRenew]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription: { $ref: "#/components/schemas/Subscription" }
        "400":
          description: Failure (no `subscription`) → throws `error`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

  /api/subscriptions/offerings:
    get:
      tags: [subscriptions]
      summary: List / lookup seller offerings
      description: |
        Multi-purpose GET.
        - no query → seller's own offerings (also `usePublishedOfferings`);
          real captured shape (fixture) `{ "offerings": [] }`.
        - `?exists=1` → `{ "exists": boolean }` (real observed → `{"offerings":[]}`
          for the published listing form; the exists form returns `exists`).
        - `?id={id}` → `{ "offering": Offering | null }`.
        Non-OK → `{ offerings: [] }`.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: exists
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
          description: Return `{ exists }` instead of the offerings list.
        - name: id
          in: query
          required: false
          schema: { type: string }
          description: Return a single `{ offering }` by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OfferingsResponse"
                  - type: object
                    title: Exists
                    properties:
                      exists: { type: boolean }
                  - type: object
                    title: Single
                    properties:
                      offering:
                        oneOf:
                          - $ref: "#/components/schemas/Offering"
                          - type: "null"
              examples:
                list:
                  value: { "offerings": [] }
                exists:
                  value: { "offerings": [] }
    post:
      tags: [subscriptions]
      summary: Create / upsert offering
      description: Client passes the full Offering object verbatim (opaque editor payload).
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Offering" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offering: { $ref: "#/components/schemas/Offering" }
        "400":
          description: Error (throws `error`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
    patch:
      tags: [subscriptions]
      summary: Set offering published state
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                published: { type: boolean }
              required: [id, published]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offering: { $ref: "#/components/schemas/Offering" }
    delete:
      tags: [subscriptions]
      summary: Delete an offering
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "400":
          description: Failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }

